<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNIT Live</title>
<style>
  :root { --accent: #D4005F; --ink: #111; --muted: #6b6b6b; --line: #e6e6e6; --soft: #f6f6f7; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; font: 13px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: #fff; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .mark { width: 12px; height: 12px; background: #000; flex: none; }
  h1 { font-size: 13px; margin: 0; font-weight: 650; }
  #status { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: #bbb; flex: none; }
  .dot.on { background: var(--accent); box-shadow: 0 0 0 3px rgba(212,0,95,.15); }
  .tools { display: flex; gap: 6px; }
  .tools button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 11px; cursor: pointer; padding: 0; }
  .tools button:hover { color: var(--ink); }
  #chat { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 10px 12px; }
  .msg { margin: 0 0 12px; }
  .msg.user { background: var(--soft); padding: 8px 10px; border-left: 2px solid var(--ink); }
  .msg.assistant p { margin: 0 0 6px; }
  .msg.assistant h3 { font-size: 13px; margin: 8px 0 4px; }
  .msg.assistant ul, .msg.assistant ol { margin: 0 0 6px; padding-left: 18px; }
  .msg.assistant b { color: var(--accent); font-weight: 650; }
  .msg table { border-collapse: collapse; width: 100%; margin: 4px 0 8px; font-size: 12px; }
  .msg th, .msg td { text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--line); }
  .msg th { font-weight: 600; }
  .msg code { font-size: 11px; background: var(--soft); padding: 0 3px; }
  .meta { color: var(--muted); font-size: 11px; margin-top: 4px; }
  #steps { color: var(--accent); font-size: 12px; padding: 0 12px 6px; min-height: 18px; }
  #suggest { display: flex; flex-direction: column; gap: 6px; padding: 0 12px 10px; }
  #suggest button { text-align: left; border: 1px solid var(--line); background: #fff; padding: 7px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  #suggest button:hover { border-color: var(--ink); }
  form { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; height: 54px; border: 1px solid var(--line); padding: 7px 8px; font: inherit; }
  textarea:focus, input:focus { outline: 1px solid var(--ink); }
  #send { border: 0; background: var(--ink); color: #fff; padding: 0 12px; font: inherit; cursor: pointer; }
  #send:disabled { background: #999; }
  .confirm { border: 1px solid var(--ink); padding: 10px; margin: 0 0 12px; }
  .confirm__title { margin: 0 0 6px; font-weight: 650; }
  .confirm ol { margin: 0 0 8px; padding-left: 18px; }
  .confirm li { margin-bottom: 4px; }
  .confirm li span { display: block; color: var(--muted); font-size: 11px; }
  .confirm__btns { display: flex; gap: 6px; }
  .confirm__btns button { border: 0; background: var(--accent); color: #fff; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .confirm__btns button[data-no] { background: none; color: var(--muted); border: 1px solid var(--line); }
  .confirm__btns button:disabled { opacity: .5; cursor: default; }
  .confirm.is-ok { border-color: var(--accent); }
  .confirm .btn { display: inline-block; text-decoration: none; background: var(--accent); color: #fff; padding: 6px 10px; font-size: 12px; }
  .confirm .btn--ghost { background: none; color: var(--ink); border: 1px solid var(--line); }
  #keyform { padding: 14px 12px; }
  #keyform p { margin: 0 0 10px; color: var(--muted); }
  #keyform input { width: 100%; padding: 7px 8px; border: 1px solid var(--line); font: inherit; margin-bottom: 8px; }
  #keyform button { border: 0; background: var(--ink); color: #fff; padding: 7px 12px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<header>
  <div class="mark"></div><h1>UNIT Live</h1><span id="status">Se conecteaza...</span>
  <div class="dot" id="dot"></div>
</header>
<div class="tools" style="padding:6px 12px 0"><button id="reset" type="button">Conversatie noua</button><button id="keybtn" type="button">Cheie</button></div>

<section id="keyform" hidden>
  <p>Introdu cheia API Anthropic. Ramane salvata doar in acest browser.</p>
  <input id="keyinput" type="password" autocomplete="off" placeholder="sk-ant-...">
  <button id="keysave" type="button">Salveaza</button>
  <p style="margin-top:10px"><button id="keyclear" type="button" style="background:none;color:var(--muted);padding:0">Sterge cheia salvata</button></p>
</section>

<section id="chat">
  <div id="log"></div>
  <div id="suggest"></div>
  <div id="steps"></div>
  <form id="form"><textarea id="q" placeholder="Intreaba modelul..."></textarea><button id="send" type="submit">&#8593;</button></form>
</section>

<script src="vendor/trimbleconnect.workspace.api.js"></script>
<script src="app.js?v=92865811"></script>
</body>
</html>
